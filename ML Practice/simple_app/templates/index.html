<!DOCTYPE html>
<html>
<head>
    <title>Titanic Survival Predictor</title>
</head>
<body>
    <h2>Titanic Survival Predictor</h2>
    <form action="/predict" method="post">
        <label>Pclass:</label><input type="number" name="Pclass" required><br><br>
        <label>Age:</label><input type="number" step="0.1" name="Age" required><br><br>
        <label>SibSp:</label><input type="number" name="SibSp" required><br><br>
        <label>Parch:</label><input type="number" name="Parch" required><br><br>
        <label>Fare:</label><input type="number" step="0.01" name="Fare" required><br><br>
        <label>HasCabin (0 or 1):</label><input type="number" name="HasCabin" required><br><br>
        <label>Embarked_Q (0 or 1):</label><input type="number" name="Embarked_Q" required><br><br>
        <label>Embarked_S (0 or 1):</label><input type="number" name="Embarked_S" required><br><br>
        <label>Sex_male (1=male, 0=female):</label><input type="number" name="Sex_male" required><br><br>

        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
        <h3>Prediction: {{ prediction_text }}</h3>
    {% endif %}
</body>
</html>
